<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOSHIGAYA BOYS | Team Schedule</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="./favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="越谷ボーイズ">
<meta name="theme-color" content="#BB5758">
<style>
:root{
  --navy:#BB5758; --navy2:#A94D4E; --orange:#f28b21; --bg:#FAF7F5;
  --card:#fff; --line:#dce4ee; --text:#172033; --muted:#687386;
  --sat:#eaf4ff; --sun:#fff0ed; --green:#1c8c65;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 18px 22px}
.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}
.brand small{opacity:.8}.brand h1{font-size:22px;margin:3px 0}.badge{background:var(--orange);padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px}.help-button{background:#fff;color:var(--navy);border:0;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 12px #6f3b3b22}.help-button:hover{transform:translateY(-1px)}
main{max-width:1180px;margin:-10px auto 40px;padding:0 14px}
.panel{background:#fff;border-radius:18px;box-shadow:0 10px 30px #6f3b3b12;padding:16px;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
button,.chip{border:0;border-radius:11px;padding:10px 13px;cursor:pointer;font-weight:700}
button.primary{background:var(--orange);color:#fff}.add-schedule{background:#133C58!important;color:#fff}.add-schedule:hover{background:#0F3047!important}.ghost{background:#edf2f7;color:var(--navy)}
.chip{background:#eef2f7}.chip.active{background:var(--navy);color:#fff}
.monthnav{display:flex;align-items:center;gap:8px}.monthnav h2{min-width:145px;text-align:center;font-size:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden}
.week div{text-align:center;padding:9px;font-size:12px;font-weight:800;background:#f7f9fc;border-right:1px solid var(--line)}
.week div:nth-child(6){background:var(--sat)}.week div:nth-child(7){background:var(--sun);border-right:0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--line);border-top:1px solid var(--line)}
.day{min-height:126px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;overflow:hidden}
.day.weekday{background:#ffffff}
.day.saturday{background:#eef7ff}
.day.sunday{background:#fff1f1}
.day.holiday{background:#fff7df}
.day.muted{opacity:.55}
.holiday-name{font-size:9px;color:#a66a00;font-weight:800;margin-left:4px}.date{font-weight:800;font-size:13px;margin-bottom:5px}
.event{font-size:11px;padding:6px;margin:4px 0;border-radius:8px;background:#edf3fa;border-left:4px solid var(--navy);cursor:pointer;line-height:1.35}
.event.game{background:#fff2e5;border-color:var(--orange)}.event.practice{background:#eaf8f2;border-color:var(--green)}
.event.exp{background:#f3ecff;border-color:#7651c9}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.view-switch{display:flex;gap:6px;margin-bottom:10px;background:#eef2f7;padding:4px;border-radius:12px;width:max-content}.viewbtn{background:transparent;color:var(--muted);padding:9px 13px}.viewbtn.active{background:#fff;color:var(--navy);box-shadow:0 2px 8px #6f3b3b14}.list{display:none}.listitem{padding:13px;border-bottom:1px solid var(--line)}.listitem b{color:var(--navy)}
.modal{position:fixed;inset:0;background:#0c1c306e;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(540px,100%);max-height:90vh;overflow:auto}
.box h3{margin-top:0}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:75px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}
.help{font-size:12px;color:var(--muted);line-height:1.6}.guide-lead{background:#f3f7fb;border-radius:12px;padding:12px 14px;line-height:1.7}.guide-section{margin-top:18px}.guide-section h4{margin:0 0 8px;color:var(--navy);font-size:15px}.guide-section ul{padding-left:22px;margin:0}.guide-section li{margin:7px 0;line-height:1.55}.guide-message{margin-top:18px;background:#fff7ed;border-left:4px solid var(--orange);border-radius:10px;padding:13px;font-weight:800;color:var(--navy);line-height:1.6}.close-x{float:right;background:#eef2f7;color:var(--navy);padding:7px 10px;border-radius:10px}
.mobilebar{display:none}
@media(max-width:720px){
  .head{align-items:flex-start;gap:8px}.help-button{font-size:12px;padding:9px 11px;white-space:nowrap;flex:0 0 auto}.brand{min-width:0}.brand small{font-size:11px;line-height:1.45;display:block}.brand h1{font-size:18px;line-height:1.35;letter-spacing:.01em;overflow-wrap:anywhere}
  main{padding:0 6px}.panel{border-radius:14px;padding:9px}
  .toolbar{align-items:flex-start}.monthnav{gap:4px}.monthnav h2{min-width:100px;font-size:15px}
  .monthnav button{padding:8px 9px}.mobilebar{display:block;background:#fff7ed;border-radius:10px;padding:9px;font-size:12px;margin:8px 0}
  .week div{padding:7px 2px;font-size:10px}
  .day{min-height:78px;padding:3px}.date{font-size:11px;margin-bottom:2px}
  .event{font-size:9px;padding:4px 3px;margin:2px 0;border-left-width:3px;line-height:1.3;overflow-wrap:anywhere}
  .event br{display:none}.listitem{padding:14px 10px;line-height:1.55;font-size:14px}.listitem b{font-size:14px}.listitem small{display:block;margin-top:4px;font-size:12px;line-height:1.5}.holiday-name{display:block;font-size:7px;margin-left:0;white-space:nowrap;overflow:hidden}
  .view-switch{width:100%;display:grid;grid-template-columns:1fr 1fr}.viewbtn{width:100%}
  .row{grid-template-columns:1fr}
}
.brand-home{color:inherit;text-decoration:none;display:inline-block;cursor:pointer}.brand-home:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}html{scroll-behavior:smooth}
.brand-home{display:inline-flex;align-items:center;gap:9px}.brand-logo{width:34px;height:34px;object-fit:contain;flex:0 0 34px;border-radius:50%}
@media(max-width:720px){.brand-home{gap:7px;align-items:center}.brand-logo{width:30px;height:30px;flex-basis:30px}}

/* Public viewer: registration/editing UI is unavailable. */
.add-schedule, #modal {display:none !important;}

/* Public viewer: help/admin controls are intentionally hidden. */


/* Public header: title only */
header{padding-top:14px;padding-bottom:14px}
.brand h1{margin:0}
@media(max-width:720px){header{padding-top:12px;padding-bottom:12px}}

</style>
</head>
<body id="top">
<header>
 <div class="head">
  <div class="brand"><h1><a href="#top" class="brand-home" aria-label="ページ先頭へ戻る"><img src="./favicon.png" class="brand-logo" alt="" aria-hidden="true">越谷ボーイズ スケジュール</a></h1></div>
  
 </div>
</header>
<main>
 <section class="panel">
  <div class="toolbar">
   <div class="monthnav">
    <button class="ghost" id="prev" aria-label="前月">‹</button><h2 id="monthTitle" aria-live="polite"></h2><button class="ghost" id="next" aria-label="次月">›</button>
    <button class="ghost" id="today">今月</button>
   </div>
   
  </div>
  <div class="mobilebar">スマホでも月間カレンダーを表示できます。「カレンダー／予定一覧」をワンタップで切替できます。</div>
  <div class="filters" style="margin-top:12px">
   <button class="chip active" data-filter="all">すべて</button>
   <button class="chip" data-filter="越谷ボーイズ">越谷ボーイズ</button>
   <button class="chip" data-filter="越谷中央ボーイズ">越谷中央ボーイズ</button>
   <button class="chip" data-filter="1">1年生</button>
   <button class="chip" data-filter="2">2年生</button>
   <button class="chip" data-filter="3">3年生</button>
  </div>
 </section>

 <section class="panel">
  <div class="view-switch" role="group" aria-label="表示切替">
   <button class="viewbtn active" id="calendarViewBtn">📅 カレンダー</button>
   <button class="viewbtn" id="listViewBtn">☰ 予定一覧</button>
  </div>
  <div class="week" id="weekHeader"><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div></div>
  <div class="calendar" id="calendar"></div>
  <div class="list" id="list"></div>
  <div class="legend">
   <span><i class="dot" style="background:#f28b21"></i>試合</span>
   <span><i class="dot" style="background:#1c8c65"></i>練習</span>
   <span><i class="dot" style="background:#7651c9"></i>体験・行事</span>
   <span><i class="dot" style="background:#102b4e"></i>その他</span><span><i class="dot" style="background:#fff;border:1px solid #ccd5df"></i>平日</span><span><i class="dot" style="background:#eef7ff"></i>土曜</span><span><i class="dot" style="background:#fff1f1"></i>日曜</span><span><i class="dot" style="background:#fff7df"></i>祝日</span>
  </div>
 </section>
</main>


</div>

<script>
const sample=[
 {date:'2026-09-19',type:'practice',title:'通常練習',team:'越谷ボーイズ',grade:'1',time:'08:00',place:'専用グラウンド',note:'水筒・昼食'},
 {date:'2026-09-20',type:'game',title:'公式戦 vs サンプルボーイズ',team:'越谷ボーイズ',grade:'3',time:'07:00',place:'越谷市民球場',note:'試合用ユニフォーム'},
 {date:'2026-09-20',type:'practice',title:'越谷中央ボーイズ 練習',team:'越谷中央ボーイズ',grade:'2',time:'09:00',place:'専用グラウンド',note:''},
 {date:'2026-09-23',type:'exp',title:'体験入部会',team:'全体',grade:'全',time:'09:30',place:'専用グラウンド',note:'小学6年生対象・グローブ持参'},
 {date:'2026-09-26',type:'game',title:'練習試合',team:'越谷中央ボーイズ',grade:'1',time:'07:30',place:'○○球場',note:'昼食持参'},
 {date:'2026-09-27',type:'practice',title:'全体練習',team:'全体',grade:'全',time:'08:00',place:'専用グラウンド',note:''}
];
let events=JSON.parse(localStorage.getItem('kb_events')||'null')||sample;
let now=new Date(); let current=new Date(now.getFullYear(),now.getMonth(),1), filter='all';
const $=s=>document.querySelector(s), cal=$('#calendar'), list=$('#list');
let viewMode='calendar';
function setView(mode){
 viewMode=mode;
 const isCal=mode==='calendar';
 $('#weekHeader').style.display=isCal?'grid':'none';
 cal.style.display=isCal?'grid':'none';
 list.style.display=isCal?'none':'block';
 $('#calendarViewBtn').classList.toggle('active',isCal);
 $('#listViewBtn').classList.toggle('active',!isCal);
}
$('#calendarViewBtn').onclick=()=>setView('calendar');
$('#listViewBtn').onclick=()=>setView('list');
function pad(n){return String(n).padStart(2,'0')}
function ymd(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}
function visible(e){return filter==='all'||e.team===filter||e.grade===filter||e.team==='全体'||e.grade==='全'}
// 日本の祝日（2026年）。祝日は土日とは別の薄いクリーム色で表示します。
const holidays2026={
 '2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日',
 '2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日',
 '2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日',
 '2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日',
 '2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日',
 '2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日'
};
function render(){
 const y=current.getFullYear(),m=current.getMonth();
 $('#monthTitle').textContent=`${y}年 ${m+1}月`;
 cal.innerHTML=''; list.innerHTML='';
 let first=new Date(y,m,1), offset=(first.getDay()+6)%7;
 let start=new Date(y,m,1-offset);
 for(let i=0;i<42;i++){
  let dt=new Date(start);dt.setDate(start.getDate()+i);
  let key=ymd(dt.getFullYear(),dt.getMonth(),dt.getDate());
  let dow=dt.getDay();
  let day=document.createElement('div');
  let dayType = holidays2026[key] ? ' holiday' : (dow===6 ? ' saturday' : (dow===0 ? ' sunday' : ' weekday'));
  day.className='day'+dayType+(dt.getMonth()!=m?' muted':'');
  day.innerHTML=`<div class="date">${dt.getDate()}${holidays2026[key]?`<span class="holiday-name">${holidays2026[key]}</span>`:''}</div>`;
  events.filter(e=>e.date===key&&visible(e)).forEach(e=>{
   let el=document.createElement('div');el.className=`event ${e.type}`;
   el.innerHTML=`<b>${e.time||''} ${e.title}</b><br>${e.team} / ${e.grade==='全'?'全学年':e.grade+'年'}`;
   el.onclick=()=>alert(`${e.title}\n${e.date} ${e.time||''}\n${e.team} / ${e.grade==='全'?'全学年':e.grade+'年'}\n場所：${e.place||'未設定'}\n連絡：${e.note||'なし'}`);
   day.appendChild(el);
  }); cal.appendChild(day);
 }
 events.filter(e=>{let d=new Date(e.date+'T00:00:00');return d.getFullYear()===y&&d.getMonth()===m&&visible(e)})
 .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).forEach(e=>{
   let x=document.createElement('div');x.className='listitem';
   x.innerHTML=`<b>${Number(e.date.slice(5,7))}/${Number(e.date.slice(8,10))}（${'日月火水木金土'[new Date(e.date+'T00:00:00').getDay()]}） ${e.time||''}</b><br>${e.title}<br><small>${e.team} / ${e.grade==='全'?'全学年':e.grade+'年'}　📍${e.place||'未設定'}</small>`;
   x.onclick=()=>alert(`${e.title}\n集合：${e.time||'未設定'}\n場所：${e.place||'未設定'}\n${e.note||''}`);list.appendChild(x);
 });
 setView(viewMode);
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('#prev').onclick=()=>{current.setMonth(current.getMonth()-1);render()};$('#next').onclick=()=>{current.setMonth(current.getMonth()+1);render()};
$('#today').onclick=()=>{let d=new Date();current=new Date(d.getFullYear(),d.getMonth(),1);render()};
// 公開版の初期表示：年月と42日分のカレンダーを必ず描画
try {
  render();
} catch (err) {
  console.error('Calendar render error:', err);
  const title = document.querySelector('#monthTitle');
  if (title && !title.textContent) {
    const d = new Date();
    title.textContent = `${d.getFullYear()}年 ${d.getMonth()+1}月`;
  }
}
</script>
</body>
</html>
